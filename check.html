<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>山岳マラソン CPチェック</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
}

h1 {
  font-size: 26px;
  margin-bottom: 5px;
}

#cp {
  font-size: 30px;
  font-weight: bold;
  margin: 15px;
}

#reader {
  width: 100%;
  max-width: 400px;
  margin: 20px auto;
  background: white;
}

#status {
  font-size: 20px;
  margin: 20px auto;
  padding: 15px;
  max-width: 400px;
  background: white;
  border-radius: 8px;
}

button {
  font-size: 22px;
  padding: 15px 30px;
  margin: 10px;
}

.ok {
  color: green;
  font-weight: bold;
}

.error {
  color: red;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>山岳マラソン</h1>

<div id="cp"></div>

<button id="startButton" onclick="startCamera()">
カメラを起動
</button>

<div id="reader"></div>

<div id="status">
カメラ起動前
</div>

<script>

// ==========================================
// GAS WebアプリURL
// ==========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbw1nGxnuATbVPHMLag1daFNAzysAwLajM13tx-5q0Cq19Oxv_9aF2VBKGaz3QRZrkJW/exec";


// ==========================================
// CP番号をURLから取得
// 例：check.html?cp=1 → CP1
// ==========================================

const params = new URLSearchParams(location.search);

const CP_ID = params.get("cp") || "1";

document.getElementById("cp").textContent =
"CP" + CP_ID;


// ==========================================
// QR読み取り準備
// ==========================================

let lastRunner = "";
let lastScanTime = 0;

const scanner = new Html5Qrcode("reader");


// ==========================================
// カメラ起動
// ==========================================

function startCamera() {

  document.getElementById("status").textContent =
    "カメラ起動中...";

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    onScanSuccess

  )

  .then(function() {

    document.getElementById("status").textContent =
      "QRコード待機中";

    document.getElementById("startButton").style.display =
      "none";

  })

  .catch(function(error) {

    document.getElementById("status").innerHTML =
      '<span class="error">' +
      "カメラを起動できません<br><br>" +
      error +
      "</span>";

  });
}


// ==========================================
// QRコードを読み取ったとき
// ==========================================

function onScanSuccess(decodedText) {

  const now = Date.now();

  // 同じQRを3秒以内に何度も読まない
  if (
    decodedText === lastRunner &&
    now - lastScanTime < 3000
  ) {
    return;
  }

  lastRunner = decodedText;
  lastScanTime = now;

  console.log("QR:", decodedText);


  // ========================================
  // QRの内容からrunnerを取得
  // ========================================

  let runner = "";

  try {

    const url = new URL(decodedText);

    runner =
      url.searchParams.get("runner");

  } catch (error) {

    // URL形式でない場合は、
    // QRの内容そのものを選手番号として扱う

    runner = decodedText;

  }


  if (!runner) {

    document.getElementById("status").innerHTML =
      '<span class="error">' +
      "選手番号を取得できません" +
      "</span>";

    return;
  }


  // ========================================
  // GASへ送信
  // ========================================

  sendRecord(runner);
}


// ==========================================
// GASへデータ送信
// ==========================================

function sendRecord(runner) {

  document.getElementById("status").textContent =
    "記録中　No." + runner;


  const data = {
    runner: runner,
    cp: CP_ID
  };


  fetch(API_URL, {

    method: "POST",

    body: JSON.stringify(data),

    headers: {
      "Content-Type": "text/plain"
    }

  })

  .then(response => response.text())

  .then(result => {

    if (result === "OK") {

      document.getElementById("status").innerHTML =
        '<span class="ok">' +
        "No." + runner +
        "　CP" + CP_ID +
        "<br>記録しました" +
        "</span>";

    } else {

      document.getElementById("status").innerHTML =
        '<span class="error">' +
        "サーバーエラー<br>" +
        result +
        "</span>";

    }

  })

  .catch(error => {

    document.getElementById("status").innerHTML =
      '<span class="error">' +
      "送信エラー<br>" +
      error +
      "</span>";

  });

}

</script>

</body>
</html>
