<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ツールド長野 CPチェック</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px 10px 110px 10px;
  background: #f5f5f5;
  box-sizing: border-box;
}

h1 {
  font-size: 26px;
  margin-bottom: 5px;
}

#cp {
  font-size: 30px;
  font-weight: bold;
  margin: 15px;
}

#reader {
  width: 80%;
  max-width: 320px;
  margin: 20px auto;
  background: white;
  overflow: hidden;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  display: block;
}

#status {
  font-size: 20px;
  margin: 20px auto;
  padding: 15px;
  width: 80%;
  max-width: 320px;
  box-sizing: border-box;
  background: white;
  border-radius: 8px;
}

button {
  font-size: 22px;
  padding: 16px 20px;
  margin: 0;
  cursor: pointer;
}

#startButton {
  position: fixed;
  left: 50%;
  bottom: calc(15px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 1000;

  width: 85%;
  max-width: 360px;

  font-size: 22px;
  font-weight: bold;

  padding: 16px 20px;

  border-radius: 12px;
}

.ok {
  color: green;
  font-weight: bold;
}

.error {
  color: red;
  font-weight: bold;
}

</style>

</head>

<body>

<h1>ツールド長野</h1>

<div id="cp">
  CP確認中...
</div>


<div id="reader"></div>


<div id="status">
  カメラ起動前
</div>


<button id="startButton" onclick="startCamera()">
  カメラを起動
</button>


<script>

// ==========================================
// GAS WebアプリURL
// ==========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbw1nGxnuATbVPHMLag1daFNAzysAwLajM13tx-5q0Cq19Oxv_9aF2VBKGaz3QRZrkJW/exec";


// ==========================================
// CP番号をURLから取得
//
// 例
// check.html?cp=1
// → CP1
// ==========================================

const params =
new URLSearchParams(location.search);

const CP_ID =
params.get("cp") || "1";

document.getElementById("cp").textContent =
"CP" + CP_ID;


// ==========================================
// QR読み取り用
// ==========================================

let scanner = null;

let isProcessing = false;


// ==========================================
// 音声
// ==========================================

let audioContext = null;


// ==========================================
// 音声準備
//
// 「カメラを起動」ボタンを押した時に
// 音声機能も準備する
//
// Android対策
// ==========================================

function prepareAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }

  }
  catch (e) {

    console.log(
      "音声準備エラー:",
      e
    );

  }

}


// ==========================================
// QR読み取り成功音
// ==========================================

function beep() {

  try {

    if (!audioContext) {

      prepareAudio();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
      audioContext.createOscillator();


    const gainNode =
      audioContext.createGain();


    oscillator.connect(
      gainNode
    );


    gainNode.connect(
      audioContext.destination
    );


    // ピッという音
    oscillator.frequency.value =
      1000;


    oscillator.type =
      "sine";


    gainNode.gain.setValueAtTime(
      0.3,
      audioContext.currentTime
    );


    gainNode.gain.exponentialRampToValueAtTime(
      0.01,
      audioContext.currentTime + 0.15
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.15
    );

  }
  catch (e) {

    console.log(
      "音声エラー:",
      e
    );

  }

}


// ==========================================
// カメラ起動
// ==========================================

function startCamera() {

  // ----------------------------------------
  // Android対策
  // ボタンを押した時点で音声を準備
  // ----------------------------------------

  prepareAudio();


  // ----------------------------------------
  // 二重起動防止
  // ----------------------------------------

  if (scanner !== null) {

    return;

  }


  isProcessing = false;


  // ----------------------------------------
  // ボタンを隠す
  // ----------------------------------------

  document.getElementById(
    "startButton"
  ).style.display =
    "none";


  // ----------------------------------------
  // 状態表示
  // ----------------------------------------

  document.getElementById(
    "status"
  ).textContent =
    "カメラ起動中...";


  // ----------------------------------------
  // QRスキャナー作成
  // ----------------------------------------

  scanner =
    new Html5Qrcode(
      "reader"
    );


  // ----------------------------------------
  // カメラ開始
  // ----------------------------------------

  scanner.start(

    {
      facingMode:
        "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 200,
        height: 200
      }

    },

    onScanSuccess

  )

  .then(function() {

    document.getElementById(
      "status"
    ).textContent =
      "QRコード待機中";

  })

  .catch(function(error) {

    console.log(
      "カメラ起動エラー:",
      error
    );


    scanner = null;


    // エラー時はボタンを再表示
    document.getElementById(
      "startButton"
    ).style.display =
      "inline-block";


    document.getElementById(
      "status"
    ).innerHTML =
      '<span class="error">' +
      "カメラを起動できません" +
      "<br><br>" +
      error +
      "</span>";

  });

}


// ==========================================
// QRコード読み取り成功
// ==========================================

function onScanSuccess(
  decodedText
) {

  // ----------------------------------------
  // 処理中なら無視
  // ----------------------------------------

  if (isProcessing) {

    return;

  }


  // ----------------------------------------
  // 二重読み取り防止
  // ----------------------------------------

  isProcessing = true;


  console.log(
    "QR読み取り:",
    decodedText
  );


  // ----------------------------------------
  // 成功音
  // ----------------------------------------

  beep();


  // ----------------------------------------
  // Android対策
  // 振動
  // ----------------------------------------

  if (
    "vibrate" in navigator
  ) {

    navigator.vibrate(
      150
    );

  }


  // ----------------------------------------
  // カメラ停止
  // ----------------------------------------

  stopCamera();


  // ----------------------------------------
  // 選手番号取得
  // ----------------------------------------

  let runner = "";


  try {

    const url =
      new URL(
        decodedText
      );


    runner =
      url.searchParams.get(
        "runner"
      );

  }
  catch (error) {

    // URL形式でない場合
    // QRコードの文字そのものを使用

    runner =
      decodedText;

  }


  // ----------------------------------------
  // 選手番号エラー
  // ----------------------------------------

  if (!runner) {

    document.getElementById(
      "status"
    ).innerHTML =
      '<span class="error">' +
      "選手番号を取得できません" +
      "</span>";


    document.getElementById(
      "startButton"
    ).style.display =
      "inline-block";


    isProcessing = false;


    return;

  }


  // ----------------------------------------
  // GASへ送信
  // ----------------------------------------

  sendRecord(
    runner
  );

}


// ==========================================
// カメラ停止
// ==========================================

function stopCamera() {

  if (
    scanner === null
  ) {

    return;

  }


  const currentScanner =
    scanner;


  // ここでnullにして
  // 再起動できる状態にする
  //
  // ただし自動再起動はしない

  scanner = null;


  currentScanner.stop()

    .then(function() {

      console.log(
        "カメラ停止"
      );


      currentScanner.clear();

    })

    .catch(function(error) {

      console.log(
        "カメラ停止エラー:",
        error
      );

    });

}


// ==========================================
// GASへデータ送信
// ==========================================

function sendRecord(
  runner
) {

  // ----------------------------------------
  // 送信中表示
  // ----------------------------------------

  document.getElementById(
    "status"
  ).textContent =
    "記録中　No." +
    runner;


  // ----------------------------------------
  // 送信データ
  // ----------------------------------------

  const data = {

    runner:
      runner,

    cp:
      CP_ID

  };


  // ----------------------------------------
  // GASへ送信
  //
  // no-corsを使用
  // ----------------------------------------

  fetch(
    API_URL,
    {

      method:
        "POST",

      mode:
        "no-cors",

      body:
        JSON.stringify(
          data
        ),

      headers: {

        "Content-Type":
          "text/plain"

      }

    }
  );


  // ----------------------------------------
  // 記録完了表示
  // ----------------------------------------

  document.getElementById(
    "status"
  ).innerHTML =
    '<span class="ok">' +

    "No." +
    runner +

    "　CP" +
    CP_ID +

    "<br><br>" +

    "記録しました" +

    "</span>";


  // ----------------------------------------
  // カメラ起動ボタンを表示
  //
  // 自動では起動しない
  // ----------------------------------------

  document.getElementById(
    "startButton"
  ).style.display =
    "inline-block";


  // ----------------------------------------
  // 次の読み取りを許可
  // ----------------------------------------

  isProcessing = false;

}


// ==========================================
// 初期状態
// ==========================================
//
// ページを開いただけでは
// カメラを起動しない
//
// 「カメラを起動」ボタンを押した時だけ
// startCamera() が実行される
// ==========================================

scanner = null;

isProcessing = false;


document.getElementById(
  "startButton"
).style.display =
  "inline-block";


document.getElementById(
  "status"
).textContent =
  "カメラ起動前";

</script>

</body>
</html>
