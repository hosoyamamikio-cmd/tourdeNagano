<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ツールド長野 CPチェック</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px 10px 110px;
  background: #f5f5f5;
}

h1 {
  font-size: 26px;
  margin-bottom: 5px;
}

#cp {
  font-size: 30px;
  font-weight: bold;
  margin: 15px;
}

#reader {
  width: 80%;
  max-width: 320px;
  margin: 20px auto;
  background: white;
  overflow: hidden;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  display: block;
}

#status {
  font-size: 20px;
  margin: 20px auto;
  padding: 15px;
  width: 80%;
  max-width: 320px;
  box-sizing: border-box;
  background: white;
  border-radius: 8px;
}

/* 記録完了画面 */

#status .runner {
  font-size: 36px;
  font-weight: bold;
}

#status .recorded {
  display: block;
  font-size: 34px;
  font-weight: bold;
  margin-top: 12px;
}

button {
  font-size: 22px;
  padding: 16px 20px;
  margin: 0;
  cursor: pointer;
}

#startButton {
  position: fixed;
  left: 50%;
  bottom: calc(15px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 1000;

  width: 85%;
  max-width: 360px;

  font-size: 22px;
  font-weight: bold;

  padding: 16px 20px;
  border-radius: 12px;
}

.ok {
  color: green;
  font-weight: bold;
}

.error {
  color: red;
  font-weight: bold;
}

</style>

</head>

<body>

<h1>ツールド長野</h1>

<div id="cp">
  CP確認中...
</div>

<div id="reader"></div>

<div id="status">
  カメラ起動前
</div>

<button id="startButton" onclick="startCamera()">
  カメラを起動
</button>


<script>

// ==========================================
// GAS WebアプリURL
// ==========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbw1nGxnuATbVPHMLag1daFNAzysAwLajM13tx-5q0Cq19Oxv_9aF2VBKGaz3QRZrkJW/exec";


// ==========================================
// CP番号取得
// ==========================================

const params =
new URLSearchParams(location.search);

const CP_ID =
params.get("cp") || "1";

document.getElementById("cp").textContent =
"CP" + CP_ID;


// ==========================================
// QR読み取り用
// ==========================================

let scanner = null;
let isProcessing = false;


// ==========================================
// 音声
// ==========================================

let audioContext = null;


// ==========================================
// 音声準備
// ==========================================

function prepareAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if (
      audioContext.state === "suspended"
    ) {

      return audioContext.resume();

    }

  } catch (e) {

    console.log("音声準備エラー", e);

  }

}


// ==========================================
// Android対策用 音声ロック解除
// ==========================================

function unlockAudio() {

  try {

    if (!audioContext) {
      return;
    }

    const oscillator =
      audioContext.createOscillator();

    const gainNode =
      audioContext.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(
      audioContext.destination
    );

    gainNode.gain.setValueAtTime(
      0,
      audioContext.currentTime
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.05
    );

  } catch (e) {

    console.log("音声ロック解除エラー", e);

  }

}


// ==========================================
// QR読み取り成功音
// ==========================================

function beep() {

  try {

    if (!audioContext) {
      return;
    }

    if (
      audioContext.state === "suspended"
    ) {

      audioContext.resume();

    }

    const oscillator =
      audioContext.createOscillator();

    const gainNode =
      audioContext.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(
      audioContext.destination
    );

    oscillator.frequency.value = 1000;
    oscillator.type = "sine";

    gainNode.gain.setValueAtTime(
      0.3,
      audioContext.currentTime
    );

    gainNode.gain.exponentialRampToValueAtTime(
      0.01,
      audioContext.currentTime + 0.15
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.15
    );

  } catch (e) {

    console.log("音声エラー", e);

  }

}


// ==========================================
// カメラ起動
// ==========================================

async function startCamera() {

  if (scanner !== null) {
    return;
  }

  // ボタン操作から音声を有効化
  await prepareAudio();

  unlockAudio();

  isProcessing = false;

  document.getElementById(
    "startButton"
  ).style.display = "none";

  document.getElementById(
    "status"
  ).textContent = "カメラ起動中...";


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 200,
        height: 200
      }

    },

    onScanSuccess

  )

  .then(function() {

    document.getElementById(
      "status"
    ).textContent =
      "QRコード待機中";

  })

  .catch(function(error) {

    console.log(
      "カメラ起動エラー",
      error
    );

    scanner = null;

    document.getElementById(
      "startButton"
    ).style.display =
      "inline-block";

    document.getElementById(
      "status"
    ).innerHTML =
      '<span class="error">' +
      "カメラを起動できません" +
      "<br><br>" +
      error +
      "</span>";

  });

}


// ==========================================
// QRコード読み取り成功
// ==========================================

function onScanSuccess(decodedText) {

  if (isProcessing) {
    return;
  }

  isProcessing = true;


  console.log(
    "QR読み取り:",
    decodedText
  );


  // 成功音
  beep();


  // カメラ停止
  stopCamera();


  // ========================================
  // 選手番号取得
  // ========================================

  let runner = "";

  try {

    const url =
      new URL(decodedText);

    runner =
      url.searchParams.get("runner");

  } catch (error) {

    runner = decodedText;

  }


  // ========================================
  // 選手番号エラー
  // ========================================

  if (!runner) {

    document.getElementById(
      "status"
    ).innerHTML =
      '<span class="error">' +
      "選手番号を取得できません" +
      "</span>";

    document.getElementById(
      "startButton"
    ).style.display =
      "inline-block";

    isProcessing = false;

    return;

  }


  // GASへ送信
  sendRecord(runner);

}


// ==========================================
// カメラ停止
// ==========================================

function stopCamera() {

  if (scanner === null) {
    return;
  }

  const currentScanner =
    scanner;

  scanner = null;

  currentScanner.stop()

    .then(function() {

      currentScanner.clear();

    })

    .catch(function(error) {

      console.log(
        "カメラ停止エラー",
        error
      );

    });

}


// ==========================================
// GASへデータ送信
// ==========================================

function sendRecord(runner) {

  document.getElementById(
    "status"
  ).textContent =
    "記録中　No." + runner;


  const data = {
    runner: runner,
    cp: CP_ID
  };


  fetch(
    API_URL,
    {
      method: "POST",

      mode: "no-cors",

      body: JSON.stringify(data),

      headers: {
        "Content-Type": "text/plain"
      }
    }
  );


  // ========================================
  // 記録完了表示
  // ========================================

  document.getElementById(
    "status"
  ).innerHTML =

    '<span class="ok">' +

    '<span class="runner">' +
    "No." + runner +
    "</span>" +

    '<span class="recorded">' +
    "記録しました" +
    "</span>" +

    "</span>";


  // ========================================
  // カメラ起動ボタン表示
  // ========================================

  document.getElementById(
    "startButton"
  ).style.display =
    "inline-block";


  isProcessing = false;

}


// ==========================================
// 初期状態
// ==========================================

scanner = null;
isProcessing = false;

document.getElementById(
  "startButton"
).style.display =
  "inline-block";

document.getElementById(
  "status"
).textContent =
  "カメラ起動前";

</script>

</body>
</html>
