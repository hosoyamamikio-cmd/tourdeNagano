<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ツールド長野 CPチェック</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
}

h1 {
  font-size: 28px;
}

#cp {
  font-size: 32px;
  font-weight: bold;
  margin: 10px;
}

#reader {
  width: 100%;
  max-width: 400px;
  margin: 20px auto;
  background: white;
}

#status {
  font-size: 20px;
  margin: 20px;
  padding: 15px;
  background: white;
}

button {
  font-size: 22px;
  padding: 15px 30px;
}

.ok {
  color: green;
  font-weight: bold;
}

.error {
  color: red;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>ツールド長野</h1>

<div id="cp">CP確認中...</div>

<button id="startButton" onclick="startCamera()">
カメラを起動
</button>

<div id="reader"></div>

<div id="status">
カメラ起動前
</div>

<script>
const API_URL = https://script.google.com/macros/s/AKfycbw1nGxnuATbVPHMLag1daFNAzysAwLajM13tx-5q0Cq19Oxv_9aF2VBKGaz3QRZrkJW/exec

"https://script.google.com/macros/s/ここをあなたのGAS_URLに変更/exec";

const params = new URLSearchParams(location.search);
const CP_ID = params.get("cp");

document.getElementById("cp").textContent =
  CP_ID ? "CP" + CP_ID : "CP番号エラー";

let lastRunner = "";
let lastScanTime = 0;

const scanner = new Html5Qrcode("reader");


function startCamera() {

  document.getElementById("status").textContent =
    "カメラ起動中...";

  document.getElementById("startButton").style.display =
    "none";

  scanner.start(

    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    onScanSuccess

  )

  .then(() => {

    document.getElementById("status").textContent =
      "QRコード待機中";

  })

  .catch(error => {

    document.getElementById("status").innerHTML =
      '<span class="error">' +
      "カメラを起動できません。<br>" +
      error +
      "</span>";

    document.getElementById("startButton").style.display =
      "inline-block";

  });

}


function onScanSuccess(decodedText) {

  const now = Date.now();

  if (
    decodedText === lastRunner &&
    now - lastScanTime < 3000
  ) {
    return;
  }

  lastRunner = decodedText;
  lastScanTime = now;

  try {

    const url = new URL(decodedText);

    const runner =
      url.searchParams.get("runner");

    if (!runner) {

      document.getElementById("status").innerHTML =
        '<span class="error">' +
        "このQRは選手QRではありません" +
        "</span>";

      return;
    }

    sendRecord(runner);

  } catch (e) {

    document.getElementById("status").innerHTML =
      '<span class="error">' +
      "QRコードを読み取れません" +
      "</span>";

  }

}


function sendRecord(runner) {

  document.getElementById("status").textContent =
    "記録中 No." + runner;

  fetch(API_URL, {

    method: "POST",

    body: JSON.stringify({

      runner: runner,
      cp: CP_ID

    })

  })

  .then(response => response.text())

  .then(result => {

    document.getElementById("status").innerHTML =
      '<span class="ok">' +
      "No." + runner +
      "　CP" + CP_ID +
      "　記録OK" +
      "</span>";

  })

  .catch(error => {

    document.getElementById("status").innerHTML =
      '<span class="error">' +
      "送信エラー" +
      "</span>";

  });

}

</script>

</body>
</html>
