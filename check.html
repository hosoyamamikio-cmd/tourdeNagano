<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ツールド長野 CPチェック</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px 10px;
  background: #f5f5f5;
  box-sizing: border-box;
}

h1 {
  font-size: 26px;
  margin-bottom: 5px;
}

#cp {
  font-size: 30px;
  font-weight: bold;
  margin: 15px;
}

#reader {
  width: 80%;
  max-width: 320px;
  margin: 20px auto;
  background: white;
  overflow: hidden;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  display: block;
}

#status {
  font-size: 20px;
  margin: 20px auto;
  padding: 15px;
  width: 80%;
  max-width: 320px;
  box-sizing: border-box;
  background: white;
  border-radius: 8px;
}

button {
  font-size: 22px;
  padding: 15px 30px;
  margin: 10px;
}

.ok {
  color: green;
  font-weight: bold;
}

.error {
  color: red;
  font-weight: bold;
}
</style>

</head>

<body>

<h1>ツールド長野</h1>

<div id="cp">CP確認中...</div>

<button id="startButton" onclick="startCamera()">
カメラを起動
</button>

<div id="reader"></div>

<div id="status">
カメラ起動前
</div>


<script>

// ==========================================
// GAS WebアプリURL
// ==========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbw1nGxnuATbVPHMLag1daFNAzysAwLajM13tx-5q0Cq19Oxv_9aF2VBKGaz3QRZrkJW/exec";


// ==========================================
// CP番号をURLから取得
// 例：check.html?cp=1 → CP1
// ==========================================

const params = new URLSearchParams(location.search);

const CP_ID = params.get("cp") || "1";

document.getElementById("cp").textContent =
"CP" + CP_ID;


// ==========================================
// QR読み取り準備
// ==========================================

let scanner = null;

let isProcessing = false;

let lastRunner = "";

let lastScanTime = 0;


// ==========================================
// カメラ起動
// ==========================================

function startCamera() {

  // 二重起動防止
  if (scanner) {
    return;
  }

  document.getElementById("status").textContent =
    "カメラ起動中...";

  document.getElementById("startButton").style.display =
    "none";

  scanner = new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 200,
        height: 200
      }

    },

    onScanSuccess

  )

  .then(function() {

    document.getElementById("status").textContent =
      "QRコード待機中";

  })

  .catch(function(error) {

    scanner = null;

    document.getElementById("startButton").style.display =
      "inline-block";

    document.getElementById("status").innerHTML =
      '<span class="error">' +
      "カメラを起動できません<br><br>" +
      error +
      "</span>";

  });
}


// ==========================================
// QRコード読み取り成功
// ==========================================

function onScanSuccess(decodedText) {

  // 処理中なら無視
  if (isProcessing) {
    return;
  }

  const now = Date.now();

  // 同じQRを3秒以内に読んだ場合は無視
  if (
    decodedText === lastRunner &&
    now - lastScanTime < 3000
  ) {
    return;
  }

  lastRunner = decodedText;
  lastScanTime = now;

  isProcessing = true;

  // ========================================
  // カメラ停止
  // ========================================

  stopCamera()
    .then(function() {

      let runner = "";

      // ====================================
      // QRの内容からrunnerを取得
      // ====================================

      try {

        const url = new URL(decodedText);

        runner =
          url.searchParams.get("runner");

      } catch (error) {

        // URL形式でない場合
        // QRの文字そのものを選手番号として扱う

        runner = decodedText;

      }


      if (!runner) {

        document.getElementById("status").innerHTML =
          '<span class="error">' +
          "選手番号を取得できません" +
          "</span>";

        isProcessing = false;

        document.getElementById("startButton").style.display =
          "inline-block";

        return;
      }


      // ====================================
      // GASへ送信
      // ====================================

      sendRecord(runner);

    });

}


// ==========================================
// カメラ停止
// ==========================================

function stopCamera() {

  if (!scanner) {
    return Promise.resolve();
  }

  return scanner.stop()

    .then(function() {

      scanner.clear();

      scanner = null;

    })

    .catch(function(error) {

      console.log(
        "カメラ停止エラー",
        error
      );

      scanner = null;

    });

}


// ==========================================
// GASへデータ送信
// ==========================================

function sendRecord(runner) {

  document.getElementById("status").textContent =
    "記録中　No." + runner;

  const data = {
    runner: runner,
    cp: CP_ID
  };


  fetch(API_URL, {

    method: "POST",

    body: JSON.stringify(data),

    headers: {
      "Content-Type": "text/plain"
    }

  })

  .then(function(response) {

    return response.text();

  })

  .then(function(result) {

    if (result.trim() === "OK") {

      // ==================================
      // 記録成功
      // ==================================

      document.getElementById("status").innerHTML =
        '<span class="ok">' +
        "No." + runner +
        "　CP" + CP_ID +
        "<br><br>" +
        "記録しました" +
        "</span>";

    } else {

      // ==================================
      // サーバー応答エラー
      // ==================================

      document.getElementById("status").innerHTML =
        '<span class="error">' +
        "サーバーからの応答エラー<br>" +
        result +
        "</span>";

    }

    // ==================================
    // カメラは再起動しない
    // 「カメラを起動」ボタンを表示
    // ==================================

    isProcessing = false;

    lastRunner = "";

    document.getElementById("startButton").style.display =
      "inline-block";

  })


  .catch(function(error) {

    // ==================================
    // 通信エラー
    // ==================================

    document.getElementById("status").innerHTML =
      '<span class="error">' +
      "送信エラー<br>" +
      error +
      "</span>";

    // ==================================
    // エラーの場合もボタンを表示
    // ==================================

    isProcessing = false;

    document.getElementById("startButton").style.display =
      "inline-block";

  });

}

</script>

</body>
</html>
