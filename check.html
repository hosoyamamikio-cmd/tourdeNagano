<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ツールド長野 CPチェック</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px 10px;
  background: #f5f5f5;
  box-sizing: border-box;
}

h1 {
  font-size: 26px;
  margin-bottom: 5px;
}

#cp {
  font-size: 30px;
  font-weight: bold;
  margin: 15px;
}

#reader {
  width: 80%;
  max-width: 320px;
  margin: 20px auto;
  background: white;
  overflow: hidden;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  display: block;
}

#status {
  font-size: 20px;
  margin: 20px auto;
  padding: 15px;
  width: 80%;
  max-width: 320px;
  box-sizing: border-box;
  background: white;
  border-radius: 8px;
}

button {
  font-size: 22px;
  padding: 15px 30px;
  margin: 10px;
  cursor: pointer;
}

.ok {
  color: green;
  font-weight: bold;
}

.error {
  color: red;
  font-weight: bold;
}
</style>

</head>

<body>

<h1>ツールド長野</h1>

<div id="cp">CP確認中...</div>

<button id="startButton" onclick="startCamera()">
カメラを起動
</button>

<div id="reader"></div>

<div id="status">
カメラ起動前
</div>


<script>

// ==========================================
// GAS WebアプリURL
// ==========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbw1nGxnuATbVPHMLag1daFNAzysAwLajM13tx-5q0Cq19Oxv_9aF2VBKGaz3QRZrkJW/exec";


// ==========================================
// CP番号をURLから取得
// ==========================================

const params = new URLSearchParams(location.search);

const CP_ID = params.get("cp") || "1";

document.getElementById("cp").textContent =
"CP" + CP_ID;


// ==========================================
// QR読み取り準備
// ==========================================

let scanner = null;

let isProcessing = false;

let lastRunner = "";

let lastScanTime = 0;


// ==========================================
// カメラ起動
// ==========================================

function startCamera() {

  // 二重起動防止
  if (scanner) {
    return;
  }

  isProcessing = false;

  document.getElementById("startButton").style.display =
    "none";

  document.getElementById("status").textContent =
    "カメラ起動中...";

  scanner = new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 200,
        height: 200
      }
    },

    onScanSuccess

  )

  .then(function() {

    document.getElementById("status").textContent =
      "QRコード待機中";

  })

  .catch(function(error) {

    scanner = null;

    document.getElementById("startButton").style.display =
      "inline-block";

    document.getElementById("status").innerHTML =
      '<span class="error">' +
      "カメラを起動できません<br><br>" +
      error +
      "</span>";

  });

}


// ==========================================
// QRコード読み取り成功
// ==========================================

function onScanSuccess(decodedText) {

  // 処理中なら無視
  if (isProcessing) {
    return;
  }

  const now = Date.now();

  // 同じQRの連続読み取りを防止
  if (
    decodedText === lastRunner &&
    now - lastScanTime < 3000
  ) {
    return;
  }

  lastRunner = decodedText;
  lastScanTime = now;

  // 処理中にする
  isProcessing = true;

  // カメラ停止
  stopCamera().then(function() {

    let runner = "";

    // ========================================
    // QRコードから選手番号を取得
    // ========================================

    try {

      const url = new URL(decodedText);

      runner =
        url.searchParams.get("runner");

    } catch (error) {

      // URLでない場合はQRの文字そのものを使用
      runner = decodedText;

    }


    // ========================================
    // 選手番号が取得できなかった場合
    // ========================================

    if (!runner) {

      document.getElementById("status").innerHTML =
        '<span class="error">' +
        "選手番号を取得できません" +
        "</span>";

      document.getElementById("startButton").style.display =
        "inline-block";

      isProcessing = false;

      return;
    }


    // ========================================
    // GASへ送信
    // ========================================

    sendRecord(runner);

  });

}


// ==========================================
// カメラ停止
// ==========================================

function stopCamera() {

  if (!scanner) {
    return Promise.resolve();
  }

  return scanner.stop()

    .then(function() {

      scanner.clear();

      scanner = null;

    })

    .catch(function(error) {

      console.log(
        "カメラ停止エラー",
        error
      );

      scanner = null;

    });

}


// ==========================================
// GASへデータ送信
// ==========================================

function sendRecord(runner) {

  document.getElementById("status").textContent =
    "GASへ送信中　No." + runner;


  const data = {

    runner: runner,

    cp: CP_ID

  };


  // ========================================
  // GASへPOST
  // no-corsにして通信結果待ちによる問題を回避
  // ========================================

  fetch(API_URL, {

    method: "POST",

    mode: "no-cors",

    body: JSON.stringify(data),

    headers: {

      "Content-Type": "text/plain"

    }

  });


  // ========================================
  // 送信開始後、画面を記録完了表示にする
  // ========================================

  document.getElementById("status").innerHTML =
    '<span class="ok">' +
    "No." + runner +
    "　CP" + CP_ID +
    "<br><br>" +
    "記録しました" +
    "</span>";


  // ========================================
  // カメラ起動ボタンを表示
  // ========================================

  document.getElementById("startButton").style.display =
    "inline-block";


  // 次の読み取りを許可
  isProcessing = false;

}


// ==========================================
// 初期状態
// ==========================================

// ページを開いたときはカメラを起動しない

document.getElementById("startButton").style.display =
  "inline-block";

document.getElementById("status").textContent =
  "カメラ起動前";

</script>

</body>
</html>
