<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ツールド長野 CPチェック</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px 10px;
  background: #f5f5f5;
  box-sizing: border-box;
}

h1 {
  font-size: 26px;
  margin-bottom: 5px;
}

#cp {
  font-size: 30px;
  font-weight: bold;
  margin: 15px;
}

#reader {
  width: 80%;
  max-width: 320px;
  margin: 20px auto;
  background: white;
  overflow: hidden;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  display: block;
}

#status {
  font-size: 20px;
  margin: 20px auto;
  padding: 15px;
  width: 80%;
  max-width: 320px;
  box-sizing: border-box;
  background: white;
  border-radius: 8px;
}

button {
  font-size: 22px;
  padding: 15px 30px;
  margin: 10px;
  cursor: pointer;
}

.ok {
  color: green;
  font-weight: bold;
}

.error {
  color: red;
  font-weight: bold;
}
</style>

</head>

<body>

<h1>ツールド長野</h1>

<div id="cp">CP確認中...</div>

<button id="startButton" onclick="startCamera()">
カメラを起動
</button>

<div id="reader"></div>

<div id="status">
カメラ起動前
</div>


<script>

// ==========================================
// GAS WebアプリURL
// ==========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbw1nGxnuATbVPHMLag1daFNAzysAwLajM13tx-5q0Cq19Oxv_9aF2VBKGaz3QRZrkJW/exec";


// ==========================================
// CP番号
// ==========================================

const params = new URLSearchParams(location.search);

const CP_ID = params.get("cp") || "1";

document.getElementById("cp").textContent =
"CP" + CP_ID;


// ==========================================
// QR読み取り
// ==========================================

let scanner = null;

let isProcessing = false;


// ==========================================
// カメラ起動
// ==========================================

function startCamera() {

  // すでにカメラが起動していたら何もしない
  if (scanner !== null) {
    return;
  }

  isProcessing = false;

  document.getElementById("startButton").style.display =
    "none";

  document.getElementById("status").textContent =
    "カメラ起動中...";

  scanner = new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 200,
        height: 200
      }
    },

    onScanSuccess

  )

  .then(function() {

    document.getElementById("status").textContent =
      "QRコード待機中";

  })

  .catch(function(error) {

    console.log("カメラ起動エラー:", error);

    scanner = null;

    document.getElementById("startButton").style.display =
      "inline-block";

    document.getElementById("status").innerHTML =
      '<span class="error">' +
      "カメラを起動できません<br><br>" +
      error +
      "</span>";

  });

}


// ==========================================
// QRコード読み取り
// ==========================================

function onScanSuccess(decodedText) {

  // すでに処理中なら無視
  if (isProcessing) {
    return;
  }

  isProcessing = true;

  console.log("QR読み取り:", decodedText);


  // ========================================
  // QR読み取り直後にカメラを停止
  // ========================================

  stopCamera();


  // ========================================
  // 選手番号取得
  // ========================================

  let runner = "";

  try {

    const url = new URL(decodedText);

    runner =
      url.searchParams.get("runner");

  } catch (error) {

    // URLでない場合
    runner = decodedText;

  }


  // ========================================
  // 選手番号が取得できない
  // ========================================

  if (!runner) {

    document.getElementById("status").innerHTML =
      '<span class="error">' +
      "選手番号を取得できません" +
      "</span>";

    document.getElementById("startButton").style.display =
      "inline-block";

    isProcessing = false;

    return;
  }


  // ========================================
  // GASへ送信
  // ========================================

  sendRecord(runner);

}


// ==========================================
// カメラ停止
// ==========================================

function stopCamera() {

  if (scanner === null) {
    return;
  }

  const currentScanner = scanner;

  scanner = null;

  currentScanner.stop()

    .then(function() {

      console.log("カメラ停止");

      currentScanner.clear();

    })

    .catch(function(error) {

      console.log(
        "カメラ停止エラー:",
        error
      );

    });

}


// ==========================================
// GASへ送信
// ==========================================

function sendRecord(runner) {

  document.getElementById("status").textContent =
    "記録中　No." + runner;


  const data = {

    runner: runner,

    cp: CP_ID

  };


  fetch(API_URL, {

    method: "POST",

    mode: "no-cors",

    body: JSON.stringify(data),

    headers: {

      "Content-Type": "text/plain"

    }

  });


  // ========================================
  // 記録表示
  // ========================================

  document.getElementById("status").innerHTML =
    '<span class="ok">' +
    "No." + runner +
    "　CP" + CP_ID +
    "<br><br>" +
    "記録しました" +
    "</span>";


  // ========================================
  // カメラ起動ボタンを表示
  // ========================================

  document.getElementById("startButton").style.display =
    "inline-block";


  // ========================================
  // 次のQR読み取りを許可
  // ========================================

  isProcessing = false;

}


// ==========================================
// 初期状態
// ==========================================

// ここではカメラを起動しない

scanner = null;

isProcessing = false;

document.getElementById("startButton").style.display =
  "inline-block";

document.getElementById("status").textContent =
  "カメラ起動前";

</script>

</body>
</html>
